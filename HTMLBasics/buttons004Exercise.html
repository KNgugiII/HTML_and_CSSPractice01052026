<!DOCTYPE html>     <!--This implies that this is a HTML5 document type-->

<html>
  <head>
    <title>
      Buttons    
    </title>

    <style>

      .jsSubscribeCSS{
        background-color: rgb(200, 0, 0);
        color: white;
        height: 50px;
        width: 200px;
        border: none;
        border-radius: 3px;
        margin-right: 5px;
        cursor: pointer;
        transition: opacity,1s;
      }

      /*
        The below script illustrates the use of pseudo classes, ie additional styles that will activate during certain situations. For instance, when we hover over or click the designated button.
      */

      .jsSubscribeCSS:hover{
        opacity: 0.8;
      }

      .jsSubscribeCSS:active{
        opacity: 0.4;
      }

      .jsJoinCSS{
        background-color:white;
        color: rgb(6, 95, 212);
        height: 50px;
        width: 100px;
        border-color: rgb(6, 95, 212);
        border-style: solid;
        border-width: 1px;
        border-radius: 3px;
        margin-right: 5px;
        cursor: pointer;
        transition: background-color 1s, color 1s;
      }

      .jsJoinCSS:hover{
        background-color:rgb(6, 95, 212) ;
        color: white;
      }

      .jsJoinCSS:active{
        opacity: 0.8;
      }

      .jsTweetCSS{
        background-color: rgb(15, 96, 201);
        color: white;
        font-weight: bold;
        height: 50px;
        width: 100px;
        border: none;
        border-radius: 25px;
        cursor:pointer;
        transition: box-shadow 1s;
      }

      .jsTweetCSS:hover{
        box-shadow: 10px 10px 10px rgba(0,0,0, 0.2);
      }

    </style>
  </head>

  <body>
    <center>
      <h1> Hover & Transition Effects </h1>
      <hr>
    </center>

    <button class="jsSubscribeCSS">
      SUBSCRIBE
    </button>

    <button class="jsJoinCSS">
      JOIN
    </button>

    <button class="jsTweetCSS">
      Tweet
    </button>

  </body>
</html>
