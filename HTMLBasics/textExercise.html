<!DOCTYPE html>   <!--This implies that this is a HTML5 document type-->

<html>
  <head>
    <title>
      TextPractice
    </title>

    <style>

      p {
        font-family: arial;
        text-align: left;
        margin-top: 0;
        margin-bottom: 0;
        color: grey;
        font-size: 14px;
      }


      .cssVideoTitle{
        font-size: 18px;
        color: black;
        font-weight: bold;
        width: 300px;
        line-height: 24px;
        margin-bottom: 5px;
      }

      .cssVideoInfo{
        margin-bottom:15px;
      }

      .cssVideoAuthor{
        margin-bottom: 15px;
      }

      .cssVideoDescription{
        width: 280px;
        line-height: 20px;
        margin-bottom: 35px;
      }

      .cssAppleProd{
        text-align: center;
        background-color: rgb(227,65,64);
        color: white;
        padding-top: 18px;
        padding-bottom: 18px;
      }

      .cssTextElementBestSelection{
        font-style: italic;
      }

      .cssApplePurchaseCTA{  
        cursor: pointer;
      }

      .cssApplePurchaseCTA:hover{
        color: blue;
        text-decoration: underline;
        
      }

    </style>
  </head>

  <body>
    <p class="cssVideoTitle">
      Talking Tech and AI with Google CEO Sundar Pichai!
    </p>

    <p class="cssVideoInfo">
      3.4M views &#xb7; 6 months ago
    </p>

    <p class="cssVideoAuthor">
      Marques Brownlee &#x2713;
    </p>

    <p class="cssVideoDescription">
      Talking tech and AI on the heels of Google I/O. Also a daily driver phone reveal from Google's CEO. Shoutout to Sundar!
    </p>

    <p class="cssAppleProd">
      Shop early for the <span class="cssTextElementBestSelection"> best selection </span>  of holiday favorites. 
        <strong>
          <span class="cssApplePurchaseCTA"> 
            Shop now &#62; 
          </span>
        </strong>        
    </p>

  </body>
</html>
