<!DOCTYPE html>     <!--This implies that this is a HTML5 document type-->

<html>
  <head>
    <title>
      Buttons    
    </title>

    <style>

      .jsSubscribeCSS{
        background-color: rgb(200, 0, 0);
        color: white;
        height: 50px;
        width: 200px;
        border: none;
        border-radius: 3px;
        margin-right: 5px;
        cursor: pointer;
      }

      .jsJoinCSS{
        background-color:white;
        color: rgb(6, 95, 212);
        height: 50px;
        width: 100px;
        border-color: rgb(6, 95, 212);
        border-style: solid;
        border-width: 1px;
        border-radius: 3px;
        margin-right: 5px;
        cursor: pointer;
      }

      .jsTweetCSS{
        background-color: rgb(15, 96, 201);
        color: white;
        font-weight: bold;
        height: 50px;
        width: 100px;
        border: none;
        border-radius: 25px;
        cursor:pointer;
      }


    </style>
  </head>

  <body>
    <center>
      <h1> Cascading Style Sheets on Buttons </h1>
      <hr>
    </center>

    <button class="jsSubscribeCSS">
      SUBSCRIBE
    </button>

    <button class="jsJoinCSS">
      JOIN
    </button>

    <button class="jsTweetCSS">
      Tweet
    </button>

  </body>
</html>
