<!DOCTYPE html>     <!--This implies that this is a HTML5 document type-->

<html>
  <head>
    <title>

    </title>

    <style>
      .jsUberCSS{
        background-color: black;
        color: white;
        border: solid;
        height: 40px;

      }

        height: 40px;

      }
